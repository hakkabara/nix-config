name: bloodhound-ce

services:
  app-db:
    image: docker.io/library/postgres:18

    environment:
      PGUSER: ${POSTGRES_USER:-bloodhound}
      POSTGRES_USER: ${POSTGRES_USER:-bloodhound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bloodhound}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bloodhound} -d ${POSTGRES_DB:-bloodhound} -h 127.0.0.1 -p 5432"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  graph-db:
    image: docker.io/library/neo4j:4.4.42

    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_SECRET:?NEO4J_SECRET is required}
      NEO4J_dbms_allow__upgrade: ${NEO4J_ALLOW_UPGRADE:-true}

    ports:
      - "127.0.0.1:${NEO4J_DB_PORT:-7687}:7687"
      - "127.0.0.1:${NEO4J_WEB_PORT:-7474}:7474"

    volumes:
      - neo4j-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O /dev/null -q http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bloodhound:
    image: docker.io/specterops/bloodhound:${BLOODHOUND_TAG:-9.5.1}

    environment:
      bhe_database_connection: >-
        user=${POSTGRES_USER:-bloodhound}
        password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB:-bloodhound}
        host=app-db

      bhe_neo4j_connection: >-
        neo4j://${NEO4J_USER:-neo4j}:${NEO4J_SECRET}@graph-db:7687/

      bhe_graph_driver: ${GRAPH_DRIVER:-neo4j}
      bhe_recreate_default_admin: "false"

    ports:
      - "${BLOODHOUND_HOST:-127.0.0.1}:${BLOODHOUND_PORT:-8080}:8080"

    depends_on:
      app-db:
        condition: service_healthy

      graph-db:
        condition: service_healthy

volumes:
  neo4j-data:
  postgres-data:
