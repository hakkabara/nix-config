[default]

# OpenSearch is private to the Compose network.
elasticsearch=http://opensearch:9200

# Offline-PCAP workstation setup.
interface=ignore
pcapDir=/opt/arkime/raw

# Viewer listens inside its container; Docker publishes localhost only.
viewHost=0.0.0.0
viewPort=8005

# Local authenticated UI.
authMode=basic

# Overridden at runtime by ARKIME__passwordSecret.
passwordSecret=runtime-secret

# Allow PCAP upload from the Arkime UI.
uploadFileSizeLimit=10G
uploadCommand=/opt/arkime/bin/capture --copy -n {NODE} -r {TMPFILE} {TAGS}

cronQueries=auto

dropUser=nobody
dropGroup=daemon
