name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard (lint, secrets, format, flake check)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required by the gitleaks Git-history scan.
          fetch-depth: 0

          # This workflow never pushes anything back to the repository.
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Format
        run: |
          nix fmt
          git diff --exit-code

      - name: Repository guard
        run: |
          nix shell             nixpkgs#bash             nixpkgs#statix             nixpkgs#deadnix             nixpkgs#sops             nixpkgs#gitleaks             nixpkgs#findutils             --command bash -eu -o pipefail               modules/home/nix-dev/scripts/nix-check.sh
