title = "Hakkabara nix-config secret scanning"

[extend]
useDefault = true


# ============================================================
# Cryptographic private keys
# ============================================================

[[rules]]
id = "private-key-block"
description = "Private cryptographic key committed in plaintext"
regex = '''-----BEGIN (OPENSSH |RSA |EC |DSA |ENCRYPTED )?PRIVATE KEY-----'''
keywords = [
  "PRIVATE KEY",
]
tags = [
  "private-key",
  "crypto",
]


[[rules]]
id = "pgp-private-key"
description = "PGP private key committed in plaintext"
regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
keywords = [
  "PGP PRIVATE KEY",
]
tags = [
  "private-key",
  "pgp",
]


# ============================================================
# age secret keys / SOPS identities
# ============================================================

[[rules]]
id = "age-secret-key"
description = "age secret identity committed in plaintext"
regex = '''AGE-SECRET-KEY-[1][0-9A-Z]{50,}'''
keywords = [
  "AGE-SECRET-KEY-",
]
tags = [
  "age",
  "private-key",
  "sops",
]


# ============================================================
# NixOS user passwords
# ============================================================

[[rules]]
id = "nixos-inline-password"
description = "Plaintext NixOS user password should be provided through a secret file"
path = '''\.nix$'''
regex = '''\b(initialPassword|password)\s*=\s*"([^"]+)"\s*;'''
secretGroup = 2
keywords = [
  "initialPassword",
  "password",
]
tags = [
  "nixos",
  "password",
]

  [[rules.allowlists]]
  description = "Locked or disabled account markers are not secrets"
  regexTarget = "match"
  regexes = [
    '''\b(initialPassword|password)\s*=\s*"[!*]+"\s*;''',
  ]


[[rules]]
id = "nixos-inline-password-hash"
description = "Password hash stored directly in Nix configuration"
path = '''\.nix$'''
regex = '''\b(initialHashedPassword|hashedPassword)\s*=\s*"([^"]{20,})"\s*;'''
secretGroup = 2
keywords = [
  "initialHashedPassword",
  "hashedPassword",
]
tags = [
  "nixos",
  "password",
]


# ============================================================
# WireGuard
# ============================================================

[[rules]]
id = "wireguard-inline-private-key"
description = "WireGuard private or preshared key committed inline"
regex = '''(?i)\b(privateKey|presharedKey)\s*=\s*"?([A-Za-z0-9+/]{43}=)"?'''
secretGroup = 2
tags = [
  "wireguard",
  "private-key",
]


# ============================================================
# Connection URLs / DSNs with embedded passwords
#
# Intentionally no keywords filter: all URI schemes are inspected, including
# https, sftp and custom/internal protocols.
# ============================================================

[[rules]]
id = "url-embedded-password"
description = "Password embedded in connection URL or DSN"
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@]+:([^\s:/@]{3,})@'''
secretGroup = 1
tags = [
  "connection-string",
  "password",
]

  [[rules.allowlists]]
  description = "Stock NixOS proxy example uses placeholder credentials"
  regexTarget = "line"
  regexes = [
    '''networking\.proxy\.default\s*=\s*\"http://user:password@proxy:port/\";''',
  ]


# ============================================================
# Windows Group Policy Preferences
# ============================================================

[[rules]]
id = "windows-gpp-cpassword"
description = "Windows GPP cpassword"
regex = '''(?i)cpassword\s*=\s*["\x27]([A-Za-z0-9+/=]{16,})["\x27]'''
secretGroup = 1
keywords = [
  "cpassword",
]
tags = [
  "windows",
  "gpp",
]


# ============================================================
# False positives: Nix secret references
# ============================================================

[allowlist]
description = "Ignore Nix sops secret reference paths"
regexes = [
  '''api/pihole/.*/(url|token)''',
]
